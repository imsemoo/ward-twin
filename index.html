<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ward Twin is now Cutaway</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://imsemoo.github.io/cutaway/">
  <script>
    // Ward Twin was renamed Cutaway. Every old link, with its path, view, room and time, goes to the same place there.
    var rest = location.pathname.replace(/^\/ward-twin\/?/, '')
    location.replace('https://imsemoo.github.io/cutaway/' + rest + location.search + location.hash)
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #e8ecf0; }
    a { color: #2946c7; }
  </style>
</head>
<body>
  <p>Ward Twin is now <a href="https://imsemoo.github.io/cutaway/">Cutaway</a>.</p>
</body>
</html>
